# Ejercicio 3: Matriz de estrategia
name: Ejercicio 3 - Matriz de Python

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # CLAVE: la matriz crea UNA ejecución del job por cada combinación,
    # y todas corren en paralelo.
    strategy:
      fail-fast: false        # si falla una versión, las demás siguen
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # entre comillas: 3.10 sin comillas = 3.1
    name: Test en Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ejecutar tests
        run: python -m unittest discover -s code/python -p "test_*.py" -v
