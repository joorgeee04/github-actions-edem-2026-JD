# Ejercicio 9: Contenedores de servicio (Postgres)
name: Ejercicio 9 - Servicio Postgres

on:
  workflow_dispatch:

jobs:
  db-test:
    runs-on: ubuntu-latest
    # CLAVE: "services" levanta contenedores auxiliares durante el job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edem
          POSTGRES_PASSWORD: edem_password
          POSTGRES_DB: curso
        ports:
          - 5432:5432           # puerto del runner : puerto del contenedor
        # Espera a que la BD esté lista antes de ejecutar los steps
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5
    steps:
      - name: Comprobar conexión
        env:
          PGPASSWORD: edem_password   # psql lee la contraseña de esta variable
        run: psql -h localhost -U edem -d curso -c "SELECT version();"
