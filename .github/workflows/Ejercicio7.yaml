# Ejercicio 7: Salidas entre jobs (outputs)
name: Ejercicio 7 - Outputs entre jobs

on:
  workflow_dispatch:

jobs:
  job-a:
    runs-on: ubuntu-latest
    # CLAVE 2: el job "publica" el output del step hacia fuera
    outputs:
      numero: ${{ steps.random.outputs.numero }}
    steps:
      - name: Generar número aleatorio
        id: random                      # el id es obligatorio para referenciarlo
        # CLAVE 1: el step escribe clave=valor en $GITHUB_OUTPUT
        run: |
          NUM=$((RANDOM % 100))
          echo "Número generado: $NUM"
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"

  job-b:
    runs-on: ubuntu-latest
    needs: job-a                        # CLAVE 3: sin needs no puedes leer sus outputs
    steps:
      - name: Leer el número
        run: echo "El job A me ha pasado el número ${{ needs.job-a.outputs.numero }}"
